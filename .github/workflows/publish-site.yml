name: Publish DealershipCore website

on:
  push:
    branches: [main]
    paths:
      - "source-parts/**"
      - "public/assets/app.js"
      - "src/**"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dealershipcore
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reconstruct validated source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts public/assets migrations
          cat source-parts/generator-*.py.part > scripts/generate_site.py
          cat source-parts/styles-*.css.part > public/assets/styles.css

          test "$(wc -c < scripts/generate_site.py)" -eq 93402
          test "$(wc -c < public/assets/styles.css)" -eq 26746
          echo "44d2dc5d20448e83f5112968978820746055e6920a5cad0890601809ca3d893c  scripts/generate_site.py" | sha256sum -c -
          echo "a74890cf359a8fb70f6e72007b0b7f3418d6dc7e733c44d6f13660e4baa48f18  public/assets/styles.css" | sha256sum -c -
          echo "c88d0847b6ed94cf82e24d9af44b455f361d0737787b7fd4a169a192ea75d614  public/assets/app.js" | sha256sum -c -
          echo "9fde1c26a4bd191b1a71747e4997a0963f63c8d184dfcd95a9c7c0ef5b4d9051  src/index.js" | sha256sum -c -
          python3 -m py_compile scripts/generate_site.py

      - name: Add application and deployment files
        shell: bash
        run: |
          set -euo pipefail
          cat > public/assets/boot.js <<'EOF'
          document.documentElement.classList.add('js');
          EOF

          cat > package.json <<'EOF'
          {
            "name": "dealershipcore-co-za",
            "version": "1.0.0",
            "private": true,
            "type": "module",
            "scripts": {
              "dev": "wrangler dev",
              "deploy": "wrangler deploy",
              "check": "node --check src/index.js && node scripts/check-site.mjs",
              "d1:create": "wrangler d1 create dealershipcore-leads",
              "d1:migrate:local": "wrangler d1 migrations apply dealershipcore-leads --local",
              "d1:migrate:remote": "wrangler d1 migrations apply dealershipcore-leads --remote"
            },
            "devDependencies": {
              "wrangler": "^4.28.1"
            }
          }
          EOF

          cat > wrangler.jsonc <<'EOF'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "dealershipcore-co-za",
            "main": "src/index.js",
            "compatibility_date": "2026-07-26",
            "assets": {
              "directory": "./public",
              "binding": "ASSETS",
              "not_found_handling": "404-page",
              "run_worker_first": ["/api/*"]
            },
            "observability": { "enabled": true },
            // Create a D1 database, then uncomment this block and replace the database_id.
            // "d1_databases": [
            //   {
            //     "binding": "DB",
            //     "database_name": "dealershipcore-leads",
            //     "database_id": "REPLACE_WITH_D1_DATABASE_ID",
            //     "migrations_dir": "migrations"
            //   }
            // ],
            "vars": {
              "ENVIRONMENT": "production"
            }
          }
          EOF

          cat > migrations/0001_init.sql <<'EOF'
          CREATE TABLE IF NOT EXISTS leads (
            id TEXT PRIMARY KEY,
            created_at TEXT NOT NULL,
            name TEXT NOT NULL,
            email TEXT NOT NULL,
            phone TEXT,
            dealership TEXT NOT NULL,
            role TEXT,
            branches TEXT,
            stock_size TEXT,
            current_system TEXT,
            challenge TEXT,
            interest TEXT,
            source TEXT NOT NULL DEFAULT 'website',
            page TEXT,
            referrer TEXT,
            utm_source TEXT,
            utm_campaign TEXT,
            country TEXT,
            city TEXT,
            status TEXT NOT NULL DEFAULT 'new',
            assigned_to TEXT,
            notes TEXT,
            updated_at TEXT
          );
          CREATE INDEX IF NOT EXISTS idx_leads_created_at ON leads(created_at DESC);
          CREATE INDEX IF NOT EXISTS idx_leads_status ON leads(status);
          CREATE INDEX IF NOT EXISTS idx_leads_email ON leads(email);
          EOF

          cat > public/_headers <<'EOF'
          /*
            X-Content-Type-Options: nosniff
            X-Frame-Options: SAMEORIGIN
            Referrer-Policy: strict-origin-when-cross-origin
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            Strict-Transport-Security: max-age=31536000; includeSubDomains; preload
            Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'

          /assets/*
            Cache-Control: public, max-age=3600, must-revalidate
          EOF

          cat > public/_redirects <<'EOF'
          /home / 301
          /demo /book-demo/ 301
          /vmg-alternative /compare/vmg-alternative/ 301
          EOF

          cat > .gitignore <<'EOF'
          node_modules/
          .wrangler/
          .dev.vars
          .DS_Store
          EOF

          cat > public/assets/og-dealershipcore.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
            <title id="title">DealershipCore</title>
            <desc id="desc">One core system for dealership growth.</desc>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset="1" stop-color="#101b2d"/></linearGradient>
              <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2878ff"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
            </defs>
            <rect width="1200" height="630" fill="url(#bg)"/>
            <g opacity=".13" stroke="#8ba7cc"><path d="M0 105h1200M0 210h1200M0 315h1200M0 420h1200M0 525h1200"/><path d="M150 0v630M300 0v630M450 0v630M600 0v630M750 0v630M900 0v630M1050 0v630"/></g>
            <rect x="72" y="72" width="190" height="42" rx="21" fill="#2878ff"/><text x="167" y="100" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">DEALER OS</text>
            <text x="72" y="245" fill="#f4f7fb" font-family="Arial,sans-serif" font-size="88" font-weight="800">DealershipCore</text>
            <text x="76" y="325" fill="#b9c9dd" font-family="Arial,sans-serif" font-size="38">One core system for dealership growth.</text>
            <text x="76" y="385" fill="#8297b3" font-family="Arial,sans-serif" font-size="27">Stock · Leads · Valuations · Automation · Reporting</text>
            <rect x="72" y="465" width="420" height="9" rx="5" fill="url(#accent)"/>
            <g transform="translate(760 112)"><rect width="354" height="378" rx="26" fill="#0d1522" stroke="#31527e"/><rect x="26" y="30" width="302" height="60" rx="14" fill="#14233a"/><rect x="26" y="114" width="142" height="104" rx="14" fill="#111d30"/><rect x="186" y="114" width="142" height="104" rx="14" fill="#111d30"/><rect x="26" y="242" width="302" height="108" rx="14" fill="#111d30"/><path d="M52 318c46-26 74-5 114-38s77 8 136-20" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/><circle cx="302" cy="260" r="8" fill="#67e8f9"/></g>
          </svg>
          EOF

      - name: Generate website
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/generate_site.py

      - name: Validate generated website
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/platform/index.html
          test -f public/ecosystem/index.html
          test -f public/compare/vmg-alternative/index.html
          test -f public/resources/dealership-software-buyers-guide/index.html
          test -f public/assets/styles.css
          test -f public/assets/app.js
          test -f public/assets/og-dealershipcore.svg
          test -f public/sitemap.xml
          test -f public/robots.txt
          test -f public/llms.txt
          test "$(find public -name index.html | wc -l)" -eq 26
          grep -q "Run your dealership from" public/index.html
          grep -q "og-dealershipcore.svg" public/index.html
          grep -q "DealershipCore vs VMG" public/compare/vmg-alternative/index.html
          node --check src/index.js
          node --check public/assets/app.js

      - name: Add project documentation
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # DealershipCore.co.za

          Production website and Cloudflare Worker for DealershipCore, the South African dealership growth operating system.

          ## Included

          - 26 SEO-indexable pages
          - Dealership owner-focused conversion journey
          - Platform, feature, solution, ecosystem, comparison, pricing and authority-resource pages
          - Responsive dark automotive UI
          - Structured data, sitemap, robots.txt and llms.txt
          - Cloudflare Worker static assets
          - Validated `/api/leads` endpoint
          - Optional D1 or secure webhook lead persistence
          - D1 migration for dealership audit and demo leads

          ## Local development

          ```bash
          npm install
          npm run dev
          ```

          ## Lead storage

          Forms intentionally return an error until either a D1 `DB` binding or `LEAD_WEBHOOK_URL` is configured. This prevents silent lead loss.

          Create D1 with `npm run d1:create`, add the returned database ID to `wrangler.jsonc`, then run `npm run d1:migrate:remote`.

          ## Deployment

          Connect this repository to Cloudflare Workers Builds, or run `npm install && npm run deploy` from an authenticated environment.
          EOF

          cat > BUILD-SUMMARY.md <<'EOF'
          # DealershipCore Build Summary

          The website contains 26 generated pages covering the platform, seven modules, dealership segments, the domain ecosystem, fair competitor comparisons, pricing, company pages, conversion forms and authority guides.

          The homepage uses an outcome-first dealership story: operational pain, connected mechanism, product modules, ecosystem advantage, owner outcomes, free systems audit, fair VMG positioning, objection handling and a final founding-dealer call to action.

          Product visuals use clearly labelled illustrative data. VMG comparison content separates public VMG capabilities, DealershipCore launch scope and roadmap areas.

          The Cloudflare Worker validates enquiries, rejects invalid submissions, supports D1 and webhook persistence, and never reports success when no storage destination is configured.
          EOF

          cat > SOURCE-NOTES.md <<'EOF'
          # Source Notes

          Competitor comparison wording was based on VMG Software's publicly available dealership management, DMS mobile and web-management product pages reviewed in August 2026. The comparison page tells readers to verify current functionality, pricing and terms directly with VMG.

          ScaleWithSEO influenced the conversion architecture only: fast positioning, problem-mechanism-outcome flow, low-friction entry offer, objection handling and FAQ structure. DealershipCore wording, design and dealership strategy are original.
          EOF

      - name: Remove transfer-only files
        shell: bash
        run: |
          rm -rf source-parts bundle payload

      - name: Commit clean production project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No production changes to publish."
            exit 0
          fi
          git commit -m "Publish complete DealershipCore website"
          git push
